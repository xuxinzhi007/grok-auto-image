<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 280px;
            padding: 16px;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            margin: 0;
        }
        h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #1a1a1a;
        }
        .info {
            background: #f5f5f5;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            margin-bottom: 12px;
        }
        .info strong {
            color: #1a1a1a;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1557b0;
        }
        button:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
        }
        #status {
            margin-top: 10px;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
        }
        .success { color: #0d7a3e; }
        .error { color: #d93025; }
        .hint {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
<h3>📥 Grok 批量下载</h3>
<div class="info">
    📸 找到 <strong id="count">0</strong> 张图片
</div>
<button id="downloadBtn">⬇️ 下载全部图片</button>
<div id="status"></div>
<div class="hint">💡 请先滚动页面加载所有图片</div>
<script src="popup.js"></script>
</body>
</html>
